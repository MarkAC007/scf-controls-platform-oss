name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # webclient/package.json `.version` is the SINGLE SOURCE OF TRUTH for the public
  # product version. prepare-oss.sh reads it to build upgrade-manifest.json, the
  # public repo's oss-release.yml reads it to compute the vX.Y.Z release tag, and
  # Dockerfile.backend bakes it into /build_info.json. Three places hand-mirror it
  # and nothing used to check them, so drift was silent until a release shipped
  # with a version label that disagreed with its own tag.
  #
  # NOTE: this deliberately does not compare against this repo's private v1.x tag
  # line (currently v1.148.x, driven by auto-release.yml from `git describe`).
  # Those are two unrelated namespaces. Conflating them is precisely the bug that
  # was removed from auto-release.yml — see the comment there.
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA-pinned: semgrep's github-actions-mutable-action-tag rule fires on
        # floating tags, and the new diff-scoped gate would flag this very line.
        # The rest of this file still uses @v5 — pre-existing, not touched here.
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Full history so the release-notes gate below can resolve a merge base.
          # Without this the checkout is shallow, `base...HEAD` has no merge base,
          # and that gate silently passes every PR. semgrep.yml sets the same value
          # for the same reason.
          fetch-depth: 0

      - name: Assert every mirrored version matches webclient/package.json
        run: |
          set -euo pipefail

          V="$(jq -r '.version' webclient/package.json)"
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=webclient/package.json::version '$V' is not a bare X.Y.Z semver"
            exit 1
          fi
          echo "source of truth: webclient/package.json = $V"

          fail=0
          check() { # <label> <actual> <file> <fix-hint>
            if [ "$2" != "$V" ]; then
              echo "::error file=$3::$1 is '$2', expected '$V'"
              echo "    fix: $4"
              fail=1
            else
              echo "  ok  $1 = $2  ($3)"
            fi
          }

          check "PLATFORM_VERSION" \
            "$(sed -n 's/^PLATFORM_VERSION=//p' .env.example | head -1)" \
            ".env.example" \
            "sed -i 's/^PLATFORM_VERSION=.*/PLATFORM_VERSION=$V/' .env.example"

          check "package-lock .version" \
            "$(jq -r '.version' webclient/package-lock.json)" \
            "webclient/package-lock.json" \
            "(cd webclient && npm install --package-lock-only)"

          check "package-lock .packages[''].version" \
            "$(jq -r '.packages."".version' webclient/package-lock.json)" \
            "webclient/package-lock.json" \
            "(cd webclient && npm install --package-lock-only)"

          # This workflow ships INTO the public OSS snapshot (prepare-oss.sh
          # keep-list), but docs-site/ does NOT — prepare-oss.sh removes it, because
          # the end-user docs are served by GitHub Pages from this private canonical
          # repo alone. Checking the docs row unconditionally therefore fails every
          # release PR on the mirror, which is what broke the first real v0.11.0
          # publish at the public `Version Consistency` check.
          #
          # The test is for the WHOLE TREE being absent, not the file: absent
          # docs-site/ means "this is the mirror". A missing file or a stale row
          # inside an existing docs-site/ is still a hard failure here, so the
          # private repo keeps exactly the enforcement it had.
          DOCS="docs-site/src/content/docs/admin-guide/configuration.mdx"
          if [ ! -d docs-site ]; then
            echo "  --  docs-site/ absent (OSS mirror) — skipping the docs version row check"
          elif ! grep -qF "| \`PLATFORM_VERSION\` | \`$V\` |" "$DOCS"; then
            echo "::error file=$DOCS::the PLATFORM_VERSION default row does not show '$V'"
            echo "    fix: update the \`PLATFORM_VERSION\` row to | \`PLATFORM_VERSION\` | \`$V\` | ..."
            fail=1
          else
            echo "  ok  docs PLATFORM_VERSION row = $V  ($DOCS)"
          fi

          exit "$fail"

      - name: Require release notes when the version is bumped
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # No --depth here, and fetch-depth: 0 on the checkout above: the three-dot
          # form needs a merge base and a shallow repository does not have one.
          git fetch --no-tags origin "$BASE_REF"

          # Assigned to a variable rather than piped straight into grep, because in a
          # pipeline the exit status belongs to the LAST command. With the shallow
          # checkout the diff aborted with "no merge base", `set -euo pipefail` saw
          # only grep's status, `if !` inverted the failed grep to true, and the step
          # announced "version file untouched" and exited 0 — so this gate had been
          # failing OPEN on every release PR. v0.17.1 shipped from a RELEASE_META.yml
          # whose summary was empty, which is the text the in-app update panel and
          # upgrade-manifest.json carry to operators. A bare assignment fails closed:
          # if the diff cannot run, set -e stops the job instead of waving it through.
          CHANGED="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          if ! printf '%s\n' "$CHANGED" | grep -qx 'webclient/package.json'; then
            echo "version file untouched — release notes not required."
            exit 0
          fi

          # Second half of the same mirror problem as the docs row above, and it
          # bites in exactly the case that matters: prepare-oss.sh strips
          # RELEASE_META.yml (and then ASSERTS its absence), while every release PR
          # on the mirror does change webclient/package.json — so the guard above
          # passes and this step would then read a file that cannot be there.
          # The check is maintainer judgement about a release, which only exists on
          # the private side; the mirror receives the rendered RELEASE_NOTES.md.
          if [ ! -f RELEASE_META.yml ]; then
            echo "RELEASE_META.yml absent (OSS mirror — prepare-oss.sh strips it) — release notes already rendered upstream."
            exit 0
          fi

          # A version bump is a release. prepare-oss.sh emits RELEASE_NOTES.md from
          # RELEASE_META.yml, and the public oss-release.yml prefers that file over
          # --generate-notes. An empty summary therefore ships a release whose notes
          # are auto-generated commit spam, and leaves the in-app update panel
          # (backend/tasks_updates.py) with nothing useful to show operators.
          # Same reasoning as release-oss.yml's preflight: pyyaml is not a
          # guaranteed part of the runner image, and this step only ever fires on
          # the PR that bumps the version — i.e. the release PR, the worst
          # possible place to discover a missing import.
          python3 -c "import yaml" 2>/dev/null || pip install --quiet --disable-pip-version-check pyyaml
          SUMMARY="$(python3 -c "import yaml;print((yaml.safe_load(open('RELEASE_META.yml')) or {}).get('summary','') or '')")"
          if [ -z "${SUMMARY// }" ]; then
            echo "::error file=RELEASE_META.yml::webclient/package.json changed but RELEASE_META.yml has no summary."
            exit 1
          fi
          echo "release summary present: ${SUMMARY}"

      - name: Assert env_added matches the .env.example delta
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # release-anchor.sh resolves the last published release from the PUBLIC
          # repo, which is public — GITHUB_TOKEN is enough to READ it and cannot
          # write to it. Same least-privilege reasoning as version-bump.yml.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # WHY THIS IS A SEPARATE STEP FROM THE SUMMARY GATE ABOVE, on a
          # DIFFERENT trigger: that gate fires when webclient/package.json is
          # merely TOUCHED, which is harmless for a field a human must fill in
          # anyway. A strict EQUALITY assertion on the same trigger is not — any
          # PR adding a frontend dependency touches that file without changing
          # the version, and would be red-lined for an env_added value that is
          # correct for the release it belongs to. So this one keys off the
          # version VALUE changing, read from both ends with jq.
          git fetch --no-tags origin "$BASE_REF"

          BASE_V="$(git show "origin/${BASE_REF}:webclient/package.json" | jq -r '.version // empty')"
          HEAD_V="$(git show "HEAD:webclient/package.json" | jq -r '.version // empty')"
          if [ "$BASE_V" = "$HEAD_V" ]; then
            echo "version unchanged (${HEAD_V}) — env_added is asserted on the release PR only."
            exit 0
          fi

          # Same mirror carve-out as the gate above: prepare-oss.sh strips
          # RELEASE_META.yml from the snapshot and then asserts its absence, while
          # every release PR on the mirror does bump the version.
          if [ ! -f RELEASE_META.yml ]; then
            echo "RELEASE_META.yml absent (OSS mirror — prepare-oss.sh strips it) — nothing to assert."
            exit 0
          fi

          # The anchor comes from the shared script, never from a second inline
          # copy of the walk — duplicating a derived fact is the defect #823 was.
          ANCHOR="$(scripts/release-anchor.sh)"

          # No pyyaml install here, unlike the summary gate above:
          # draft-release-notes.py has no third-party imports and parses this one
          # field itself, precisely so a CI gate cannot fail on a missing package.
          RC=0
          python3 scripts/draft-release-notes.py \
            --check-env-added RELEASE_META.yml \
            --anchor "$ANCHOR" --head HEAD --version "$HEAD_V" --no-gh || RC=$?
          case "$RC" in
            0) echo "env_added agrees with the .env.example delta over ${ANCHOR}..HEAD." ;;
            1) echo "::error file=RELEASE_META.yml::env_added does not match the .env.example key delta over ${ANCHOR}..HEAD (see the log for which keys). This field is DERIVED, not curated — re-run \`Propose Version Bump\`, or \`python3 scripts/draft-release-notes.py --write RELEASE_META.yml\`, rather than editing it by hand."
               exit 1 ;;
            *) echo "::error file=RELEASE_META.yml::the env_added check could not run (exit ${RC}) — see the log."
               exit 1 ;;
          esac

  detect:
    name: Detect Stack
    runs-on: ubuntu-latest
    outputs:
      has_python: ${{ steps.check.outputs.has_python }}
      has_typescript: ${{ steps.check.outputs.has_typescript }}
      has_docker: ${{ steps.check.outputs.has_docker }}
      repo_lower: ${{ steps.check.outputs.repo_lower }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check stack components
        id: check
        run: |
          # Detect Python backend
          if [ -f "backend/requirements.txt" ] || [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "has_python=true" >> $GITHUB_OUTPUT
            echo "✓ Python backend detected"
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
          fi

          # Detect TypeScript frontend
          if [ -f "webclient/package.json" ] || [ -f "package.json" ]; then
            echo "has_typescript=true" >> $GITHUB_OUTPUT
            echo "✓ TypeScript frontend detected"
          else
            echo "has_typescript=false" >> $GITHUB_OUTPUT
          fi

          # Detect Docker
          if [ -f "docker-compose.yml" ] || [ -f "Dockerfile" ]; then
            echo "has_docker=true" >> $GITHUB_OUTPUT
            echo "✓ Docker configuration detected"
          else
            echo "has_docker=false" >> $GITHUB_OUTPUT
          fi

          # Lowercase repo name for Docker tags
          echo "repo_lower=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          echo "Repository: ${GITHUB_REPOSITORY,,}"

  python:
    name: Python Backend
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    # A throwaway PostgreSQL for the backup/restore round-trip tests, which
    # exercise cascade + constraint behaviour a mocked session cannot express
    # (test_database_backup_restore.py). Wired via TEST_RESTORE_DATABASE_URL
    # below; the schema is created and dropped by the test's own fixtures.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scftest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov flake8 black

      - name: Lint with flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Format check with black
        run: black --check .
        continue-on-error: true

      - name: Run tests with pytest
        run: |
          if [ -d "tests" ] || [ -d "backend/tests" ]; then
            pytest --cov --cov-report=xml --cov-report=term
          else
            echo "No tests directory found, skipping tests"
          fi

      # The backup/restore endpoints are the most destructive pair in the
      # platform and their tests skip whenever TEST_RESTORE_DATABASE_URL is
      # unset — which, before this, was everywhere including CI. Run them
      # explicitly against the Postgres service so the cross-tenant write guard
      # (#870) and the blast-radius regressions cannot silently rot.
      - name: Backup/restore security tests (Postgres)
        if: hashFiles('backend/tests/test_database_backup_restore.py') != ''
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/scftest
          TEST_RESTORE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/scftest
          DB_INIT_MODE: alembic
        run: |
          pytest tests/test_database_backup_restore.py -v

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: python
          fail_ci_if_error: false

  typescript:
    name: TypeScript Frontend
    needs: detect
    if: needs.detect.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webclient
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './webclient/package-lock.json'

      - name: Install dependencies
        run: |
          npm ci
          # Workaround for npm optional dependencies bug (https://github.com/npm/cli/issues/4828)
          # Explicitly install platform-specific rollup binary if missing
          npm ls @rollup/rollup-linux-x64-gnu || npm install @rollup/rollup-linux-x64-gnu --save-optional --ignore-scripts

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run type-check --if-present || npx tsc --noEmit --skipLibCheck || echo "No TypeScript config found"

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

  docker:
    name: Docker Build
    needs: [detect, python, typescript]
    if: |
      always() &&
      needs.detect.outputs.has_docker == 'true' &&
      (needs.python.result == 'success' || needs.python.result == 'skipped') &&
      (needs.typescript.result == 'success' || needs.typescript.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          # PAT required for private submodule access
          # Create a PAT with 'repo' scope and add as GH_PAT secret
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Free disk space
        # Slice 13 (Docling): backend image grew ~3GB with Docling's
        # PyTorch/easyocr deps. The runner's default ~14GB writable disk
        # overflows when `docker compose build` builds backend, celery-worker,
        # celery-beat in parallel (all share Dockerfile.backend → 3× ~5GB).
        # Aggressive cleanup of preinstalled toolchains reclaims ~30GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby \
            /usr/share/swift /usr/local/share/boost || true
          sudo apt-get -y remove --purge azure-cli google-cloud-cli \
            microsoft-edge-stable google-chrome-stable firefox \
            'mongodb-*' 'mysql-*' 'postgresql-*' 'temurin-*-jdk' || true
          sudo apt-get -y autoremove --purge || true
          sudo apt-get -y clean || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Docker Compose
        if: hashFiles('docker-compose.yml') != ''
        # Slice 13: build only one service per unique Dockerfile, not all
        # services. backend/celery-worker/celery-beat all use Dockerfile.backend
        # — building them in parallel triples the disk footprint of the
        # Docling-laden image with no extra coverage. We build backend
        # (covers all three) + frontend (Dockerfile.frontend.dev).
        run: |
          docker compose build --no-cache backend frontend
          echo "✓ Built backend (also covers celery-worker, celery-beat via shared Dockerfile.backend)"
          echo "✓ Built frontend"
          df -h /

      - name: Build Docker image
        if: hashFiles('docker-compose.yml') == '' && hashFiles('Dockerfile') != ''
        run: |
          docker build -t ghcr.io/${{ needs.detect.outputs.repo_lower }}:${{ github.sha }} .
          echo "✓ Built image: ghcr.io/${{ needs.detect.outputs.repo_lower }}:${{ github.sha }}"

      - name: Test containers
        if: hashFiles('docker-compose.yml') != ''
        run: |
          docker compose up -d
          sleep 10
          docker compose ps
          docker compose logs
          docker compose down
        continue-on-error: true
