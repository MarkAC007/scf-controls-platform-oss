name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every job in this file reads the repository and nothing else. Without this
# block the jobs take whatever the repository's settings give the token by
# default. A job that needs more states it on the job.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # webclient/package.json `.version` is the SINGLE SOURCE OF TRUTH for the public
  # product version. prepare-oss.sh reads it to build upgrade-manifest.json, the
  # public repo's oss-release.yml reads it to compute the vX.Y.Z release tag, and
  # Dockerfile.backend bakes it into /build_info.json. Three places hand-mirror it
  # and nothing used to check them, so drift was silent until a release shipped
  # with a version label that disagreed with its own tag.
  #
  # NOTE: this deliberately does not compare against this repo's private v1.x tag
  # line (currently v1.148.x, driven by auto-release.yml from `git describe`).
  # Those are two unrelated namespaces. Conflating them is precisely the bug that
  # was removed from auto-release.yml — see the comment there.
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # zizmor: ignore[artipacked] the release-notes gates below fetch the base branch with this credential
        # SHA-pinned: semgrep's github-actions-mutable-action-tag rule fires on
        # floating tags, and the new diff-scoped gate would flag this very line.
        # The rest of this file still uses @v5 — pre-existing, not touched here.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the release-notes gate below can resolve a merge base.
          # Without this the checkout is shallow, `base...HEAD` has no merge base,
          # and that gate silently passes every PR. semgrep.yml sets the same value
          # for the same reason.
          fetch-depth: 0

      - name: Assert every mirrored version matches webclient/package.json
        run: |
          set -euo pipefail

          V="$(jq -r '.version' webclient/package.json)"
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=webclient/package.json::version '$V' is not a bare X.Y.Z semver"
            exit 1
          fi
          echo "source of truth: webclient/package.json = $V"

          fail=0
          check() { # <label> <actual> <file> <fix-hint>
            if [ "$2" != "$V" ]; then
              echo "::error file=$3::$1 is '$2', expected '$V'"
              echo "    fix: $4"
              fail=1
            else
              echo "  ok  $1 = $2  ($3)"
            fi
          }

          check "PLATFORM_VERSION" \
            "$(sed -n 's/^PLATFORM_VERSION=//p' .env.example | head -1)" \
            ".env.example" \
            "sed -i 's/^PLATFORM_VERSION=.*/PLATFORM_VERSION=$V/' .env.example"

          check "package-lock .version" \
            "$(jq -r '.version' webclient/package-lock.json)" \
            "webclient/package-lock.json" \
            "(cd webclient && npm install --package-lock-only)"

          check "package-lock .packages[''].version" \
            "$(jq -r '.packages."".version' webclient/package-lock.json)" \
            "webclient/package-lock.json" \
            "(cd webclient && npm install --package-lock-only)"

          # This workflow ships INTO the public OSS snapshot (prepare-oss.sh
          # keep-list), but docs-site/ does NOT — prepare-oss.sh removes it, because
          # the end-user docs are served by GitHub Pages from this private canonical
          # repo alone. Checking the docs row unconditionally therefore fails every
          # release PR on the mirror, which is what broke the first real v0.11.0
          # publish at the public `Version Consistency` check.
          #
          # The test is for the WHOLE TREE being absent, not the file: absent
          # docs-site/ means "this is the mirror". A missing file or a stale row
          # inside an existing docs-site/ is still a hard failure here, so the
          # private repo keeps exactly the enforcement it had.
          DOCS="docs-site/src/content/docs/admin-guide/configuration.mdx"
          if [ ! -d docs-site ]; then
            echo "  --  docs-site/ absent (OSS mirror) — skipping the docs version row check"
          elif ! grep -qF "| \`PLATFORM_VERSION\` | \`$V\` |" "$DOCS"; then
            echo "::error file=$DOCS::the PLATFORM_VERSION default row does not show '$V'"
            echo "    fix: update the \`PLATFORM_VERSION\` row to | \`PLATFORM_VERSION\` | \`$V\` | ..."
            fail=1
          else
            echo "  ok  docs PLATFORM_VERSION row = $V  ($DOCS)"
          fi

          # helm-charts/ ships in BOTH repos (OSS #112): the chart is maintained
          # here and published with the snapshot, and Argo CD consumes it straight
          # from a git tag, so Chart.yaml's two version fields are release
          # artefacts exactly like the rows above. The directory test only
          # covers a snapshot that predates the chart; today it is always present.
          #
          # Both fields track the product version: `version` bare, because Helm
          # requires semver, and `appVersion` with the leading v, because that is
          # how the images are tagged and it is what the chart defaults image tags
          # to. A stale appVersion silently deploys the previous release.
          CHART="helm-charts/charts/scf-controls-platform/Chart.yaml"
          if [ ! -d helm-charts ]; then
            echo "  --  helm-charts/ absent — skipping the chart version rows"
          else
            check "Chart.yaml version" \
              "$(sed -n 's/^version: //p' "$CHART" | head -1)" \
              "$CHART" \
              "sed -i 's/^version: .*/version: $V/' $CHART"

            check "Chart.yaml appVersion" \
              "$(sed -n 's/^appVersion: v//p' "$CHART" | head -1)" \
              "$CHART" \
              "sed -i 's/^appVersion: .*/appVersion: v$V/' $CHART"
          fi

          exit "$fail"

      - name: Require release notes when the version is bumped
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # No --depth here, and fetch-depth: 0 on the checkout above: the three-dot
          # form needs a merge base and a shallow repository does not have one.
          git fetch --no-tags origin "$BASE_REF"

          # Assigned to a variable rather than piped straight into grep, because in a
          # pipeline the exit status belongs to the LAST command. With the shallow
          # checkout the diff aborted with "no merge base", `set -euo pipefail` saw
          # only grep's status, `if !` inverted the failed grep to true, and the step
          # announced "version file untouched" and exited 0 — so this gate had been
          # failing OPEN on every release PR. v0.17.1 shipped from a RELEASE_META.yml
          # whose summary was empty, which is the text the in-app update panel and
          # upgrade-manifest.json carry to operators. A bare assignment fails closed:
          # if the diff cannot run, set -e stops the job instead of waving it through.
          CHANGED="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          if ! printf '%s\n' "$CHANGED" | grep -qx 'webclient/package.json'; then
            echo "version file untouched — release notes not required."
            exit 0
          fi

          # Second half of the same mirror problem as the docs row above, and it
          # bites in exactly the case that matters: prepare-oss.sh strips
          # RELEASE_META.yml (and then ASSERTS its absence), while every release PR
          # on the mirror does change webclient/package.json — so the guard above
          # passes and this step would then read a file that cannot be there.
          # The check is maintainer judgement about a release, which only exists on
          # the private side; the mirror receives the rendered RELEASE_NOTES.md.
          if [ ! -f RELEASE_META.yml ]; then
            echo "RELEASE_META.yml absent (OSS mirror — prepare-oss.sh strips it) — release notes already rendered upstream."
            exit 0
          fi

          # A version bump is a release. prepare-oss.sh emits RELEASE_NOTES.md from
          # RELEASE_META.yml, and the public oss-release.yml prefers that file over
          # --generate-notes. An empty summary therefore ships a release whose notes
          # are auto-generated commit spam, and leaves the in-app update panel
          # (backend/tasks_updates.py) with nothing useful to show operators.
          # version-bump.yml no longer opens a PR without a summary (it refuses at
          # dispatch), so on a bump PR this only trips if a later commit blanks the
          # field; on a hand-made bump it is the first and only line of defence.
          # Same reasoning as release-oss.yml's preflight: pyyaml is not a
          # guaranteed part of the runner image, and this step only ever fires on
          # the PR that bumps the version — i.e. the release PR, the worst
          # possible place to discover a missing import.
          python3 -c "import yaml" 2>/dev/null || pip install --quiet --disable-pip-version-check pyyaml
          SUMMARY="$(python3 -c "import yaml;print((yaml.safe_load(open('RELEASE_META.yml')) or {}).get('summary','') or '')")"
          if [ -z "${SUMMARY// }" ]; then
            echo "::error file=RELEASE_META.yml::webclient/package.json changed but RELEASE_META.yml has no summary."
            exit 1
          fi
          echo "release summary present: ${SUMMARY}"

      - name: Assert env_added matches the .env.example delta
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # release-anchor.sh resolves the last published release from the PUBLIC
          # repo, which is public — GITHUB_TOKEN is enough to READ it and cannot
          # write to it. Same least-privilege reasoning as version-bump.yml.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # WHY THIS IS A SEPARATE STEP FROM THE SUMMARY GATE ABOVE, on a
          # DIFFERENT trigger: that gate fires when webclient/package.json is
          # merely TOUCHED, which is harmless for a field a human must fill in
          # anyway. A strict EQUALITY assertion on the same trigger is not — any
          # PR adding a frontend dependency touches that file without changing
          # the version, and would be red-lined for an env_added value that is
          # correct for the release it belongs to. So this one keys off the
          # version VALUE changing, read from both ends with jq.
          git fetch --no-tags origin "$BASE_REF"

          BASE_V="$(git show "origin/${BASE_REF}:webclient/package.json" | jq -r '.version // empty')"
          HEAD_V="$(git show "HEAD:webclient/package.json" | jq -r '.version // empty')"
          if [ "$BASE_V" = "$HEAD_V" ]; then
            echo "version unchanged (${HEAD_V}) — env_added is asserted on the release PR only."
            exit 0
          fi

          # Same mirror carve-out as the gate above: prepare-oss.sh strips
          # RELEASE_META.yml from the snapshot and then asserts its absence, while
          # every release PR on the mirror does bump the version.
          if [ ! -f RELEASE_META.yml ]; then
            echo "RELEASE_META.yml absent (OSS mirror — prepare-oss.sh strips it) — nothing to assert."
            exit 0
          fi

          # The anchor comes from the shared script, never from a second inline
          # copy of the walk — duplicating a derived fact is the defect #823 was.
          ANCHOR="$(scripts/release-anchor.sh)"

          # No pyyaml install here, unlike the summary gate above:
          # draft-release-notes.py has no third-party imports and parses this one
          # field itself, precisely so a CI gate cannot fail on a missing package.
          RC=0
          python3 scripts/draft-release-notes.py \
            --check-env-added RELEASE_META.yml \
            --anchor "$ANCHOR" --head HEAD --version "$HEAD_V" --no-gh || RC=$?
          case "$RC" in
            0) echo "env_added agrees with the .env.example delta over ${ANCHOR}..HEAD." ;;
            1) echo "::error file=RELEASE_META.yml::env_added does not match the .env.example key delta over ${ANCHOR}..HEAD (see the log for which keys). This field is DERIVED, not curated — re-run \`Propose Version Bump\`, or \`python3 scripts/draft-release-notes.py --write RELEASE_META.yml\`, rather than editing it by hand."
               exit 1 ;;
            *) echo "::error file=RELEASE_META.yml::the env_added check could not run (exit ${RC}) — see the log."
               exit 1 ;;
          esac

  detect:
    name: Detect Stack
    runs-on: ubuntu-latest
    outputs:
      has_python: ${{ steps.check.outputs.has_python }}
      has_typescript: ${{ steps.check.outputs.has_typescript }}
      has_docker: ${{ steps.check.outputs.has_docker }}
      repo_lower: ${{ steps.check.outputs.repo_lower }}
      version_bump_only: ${{ steps.bump.outputs.version_bump_only }}
    steps:
      - name: Checkout code
        # zizmor: ignore[artipacked] the version-bump classifier below fetches the base branch with this credential
        # SHA-pinned for the same semgrep reason as the Version Consistency
        # checkout; full history so the bump classifier below has a merge base.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check stack components
        id: check
        run: |
          # Detect Python backend
          if [ -f "backend/requirements.txt" ] || [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "has_python=true" >> $GITHUB_OUTPUT
            echo "✓ Python backend detected"
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
          fi

          # Detect TypeScript frontend
          if [ -f "webclient/package.json" ] || [ -f "package.json" ]; then
            echo "has_typescript=true" >> $GITHUB_OUTPUT
            echo "✓ TypeScript frontend detected"
          else
            echo "has_typescript=false" >> $GITHUB_OUTPUT
          fi

          # Detect Docker
          if [ -f "docker-compose.yml" ] || [ -f "Dockerfile" ]; then
            echo "has_docker=true" >> $GITHUB_OUTPUT
            echo "✓ Docker configuration detected"
          else
            echo "has_docker=false" >> $GITHUB_OUTPUT
          fi

          # Lowercase repo name for Docker tags
          echo "repo_lower=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          echo "Repository: ${GITHUB_REPOSITORY,,}"

      # A version-bump PR (version-bump.yml) changes nothing but version strings
      # and release notes, yet it paid ~15 min of pytest -> Docker Build on a tree
      # that differs from an already-green main only by those strings — and paid
      # it again on every "Update branch", because main protection is strict.
      # When this step proves the diff is ONLY that, python/typescript/docker are
      # skipped; a job skipped by its own `if:` reports "skipped", which satisfies
      # a required check, whereas a workflow-level paths filter would leave the
      # check missing and block the merge.
      #
      # The full suite still runs on the merge commit (push to main), and
      # release-oss.yml refuses to publish a SHA whose CI is not green, so a
      # skip here moves the verification later — it never removes it.
      #
      # The proof is CONTENT-based, never name-based: a branch name or PR title is
      # free text anyone can set. Every rule must hold or the answer is false:
      #   1. webclient/package.json's version changed (it IS a bump);
      #   2. every changed path is in the six-file allowlist version-bump.yml writes;
      #   3. each data file is unchanged apart from its version fields — compared
      #      structurally for the JSON files, line-by-line for the rest.
      # RELEASE_META.yml is allowed free-form: it is release-notes data, read only
      # by the release scripts and gated by the Version Consistency job above.
      #
      # FAIL-CLOSED: continue-on-error so a crash here can never fail `detect`
      # (a failed `detect` would SKIP the required jobs, which reads as a pass).
      # A crash leaves the output unset, and only the literal 'true' skips anything.
      - name: Classify version-bump-only PRs
        id: bump
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -uo pipefail
          verdict() { echo "version_bump_only=$1" >> "$GITHUB_OUTPUT"; echo "version_bump_only=$1 — $2"; exit 0; }

          git fetch --no-tags -q origin "$BASE_REF" || verdict false "could not fetch ${BASE_REF}"
          BASE="$(git merge-base "origin/${BASE_REF}" HEAD)" || verdict false "no merge base"
          CHANGED="$(git diff --name-only "$BASE" HEAD)" || verdict false "diff failed"
          [ -n "$CHANGED" ] || verdict false "empty diff"

          # Rule 1 — the version actually moved.
          OLD_V="$(git show "${BASE}:webclient/package.json" | jq -r '.version')" || verdict false "base package.json unreadable"
          NEW_V="$(jq -r '.version' webclient/package.json)" || verdict false "head package.json unreadable"
          [ "$OLD_V" != "$NEW_V" ] || verdict false "webclient/package.json version unchanged (${NEW_V})"

          # Rule 2 — allowlist.
          ALLOW='^(\.env\.example|RELEASE_META\.yml|docs-site/src/content/docs/admin-guide/configuration\.mdx|helm-charts/charts/scf-controls-platform/Chart\.yaml|webclient/package\.json|webclient/package-lock\.json)$'
          OUTSIDE="$(printf '%s\n' "$CHANGED" | grep -Ev "$ALLOW" || true)"
          [ -z "$OUTSIDE" ] || verdict false "touches files outside the bump allowlist: $(echo $OUTSIDE)"

          # Rule 3a — JSON: identical once the version fields are removed. A real
          # dependency change anywhere in the lockfile makes these differ.
          json_same() { # <path> <jq-del-filter>
            cmp -s <(git show "${BASE}:$1" | jq -S "$2") <(jq -S "$2" "$1")
          }
          json_same webclient/package.json 'del(.version)' \
            || verdict false "webclient/package.json changed beyond .version"
          json_same webclient/package-lock.json 'del(.version, .packages[""].version)' \
            || verdict false "webclient/package-lock.json changed beyond its two root version fields"

          # Rule 3b — line files: every changed line must match that file's
          # version-line pattern. -U0 output; skip the ---/+++ headers.
          # The diff is captured first so a git failure fails the rule instead of
          # reaching grep as an empty (i.e. "clean") stream; the offending lines are
          # then collected and tested for emptiness, never via `! ... | grep -q`,
          # whose early exit can SIGPIPE upstream and invert under pipefail.
          lines_ok() { # <path> <ERE every +/- line must match>
            local d bad
            d="$(git diff -U0 "$BASE" HEAD -- "$1")" || return 1
            bad="$(printf '%s\n' "$d" | grep -E '^[-+]' | grep -Ev '^(---|\+\+\+) ' | sed 's/^[-+]//' | grep -Ev "$2")"
            [ -z "$bad" ] || { echo "  unexpected change in $1: $(printf '%s' "$bad" | head -3)"; return 1; }
          }
          lines_ok .env.example '^PLATFORM_VERSION=[0-9]+\.[0-9]+\.[0-9]+$' \
            || verdict false ".env.example changed beyond PLATFORM_VERSION"
          lines_ok helm-charts/charts/scf-controls-platform/Chart.yaml '^(version: [0-9]+\.[0-9]+\.[0-9]+|appVersion: v[0-9]+\.[0-9]+\.[0-9]+)$' \
            || verdict false "Chart.yaml changed beyond version/appVersion"
          lines_ok docs-site/src/content/docs/admin-guide/configuration.mdx '^\| `PLATFORM_VERSION` \| `[0-9]+\.[0-9]+\.[0-9]+` \|' \
            || verdict false "configuration.mdx changed beyond the PLATFORM_VERSION row"

          verdict true "${OLD_V} -> ${NEW_V}, version strings and release notes only; heavy jobs will skip"

  python:
    name: Python Backend
    needs: detect
    if: needs.detect.outputs.has_python == 'true' && needs.detect.outputs.version_bump_only != 'true'
    runs-on: ubuntu-latest
    # A throwaway PostgreSQL for the backup/restore round-trip tests, which
    # exercise cascade + constraint behaviour a mocked session cannot express
    # (test_database_backup_restore.py). Wired via TEST_RESTORE_DATABASE_URL
    # below; the schema is created and dropped by the test's own fixtures.
    services:
      postgres:
        # The same major and variant the product ships in docker-compose.yml
        # (PostgreSQL 15.20 at the time of pinning). The digest decides what runs;
        # the tag is there to be read.
        image: postgres:15-alpine@sha256:fc41cfa8a90c09e84dd723ee764be4b2f59ba6c98b1e5b3fca540adddf68a5ba
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scftest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is needed for the clone only; no later step talks to the
          # remote through git.
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # Both files are locks: every package pinned by version and sha256,
      # compiled by scripts/lock-python-deps.sh. --require-hashes stops the
      # job on anything the locks do not list. The lint and test tools go in
      # first because that lock also carries setuptools, which builds pyclamd,
      # the one backend dependency published as source only.
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: \
            -r backend/requirements-dev.txt
          python -m pip install --require-hashes --only-binary :all: \
            --no-binary pyclamd --no-build-isolation \
            -r backend/requirements.txt

      # Syntax errors and undefined names stop the job. Plan 8.3 removed the
      # advisory flake8 pass (--exit-zero) and the black check
      # (continue-on-error): neither could fail, so neither was a gate.
      - name: Lint with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # A second Alembic head — two branches each adding a migration off the
      # same parent — fails here, in CI, rather than at an operator's
      # `alembic upgrade head` during scripts/upgrade.sh. `alembic heads` reads
      # the script directory only; no database is needed (#902, FM-7).
      - name: Assert a single Alembic head
        working-directory: backend
        run: |
          heads="$(alembic heads)"
          echo "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1

      - name: Run tests with pytest
        run: |
          if [ -d "tests" ] || [ -d "backend/tests" ]; then
            pytest --cov --cov-report=xml --cov-report=term
          else
            echo "No tests directory found, skipping tests"
          fi

      # The backup/restore endpoints are the most destructive pair in the
      # platform and their tests skip whenever TEST_RESTORE_DATABASE_URL is
      # unset — which, before this, was everywhere including CI. Run them
      # explicitly against the Postgres service so the cross-tenant write guard
      # (#870) and the blast-radius regressions cannot silently rot.
      - name: Backup/restore security tests (Postgres)
        if: hashFiles('backend/tests/test_database_backup_restore.py') != ''
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/scftest
          TEST_RESTORE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/scftest
          DB_INIT_MODE: alembic
        run: |
          pytest tests/test_database_backup_restore.py -v

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          file: ./coverage.xml
          flags: python
          fail_ci_if_error: false

  typescript:
    name: TypeScript Frontend
    needs: detect
    if: needs.detect.outputs.has_typescript == 'true' && needs.detect.outputs.version_bump_only != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webclient
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is needed for the clone only; no later step talks to the
          # remote through git.
          persist-credentials: false

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './webclient/package-lock.json'

      - name: Install dependencies
        # A frozen install: exactly what webclient/package-lock.json pins, or
        # the step fails. No step in this job may change the lockfile or fetch
        # a package it does not pin (backend/tests/test_frontend_lock.py).
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    name: Docker Build
    needs: [detect, python, typescript]
    if: |
      always() &&
      needs.detect.outputs.has_docker == 'true' &&
      needs.detect.outputs.version_bump_only != 'true' &&
      (needs.python.result == 'success' || needs.python.result == 'skipped') &&
      (needs.typescript.result == 'success' || needs.typescript.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job's own token, and no submodules. This checkout used to pass
          # GH_PAT to fetch a private `catalog` submodule; that submodule was
          # removed in 798ccae5, so the personal token reached this job for
          # nothing.
          # The token is needed for the clone only. Left at the default it
          # stays in the git config for every later step, and the steps below
          # run Dockerfiles and dependency installs that have no business
          # reading it.
          persist-credentials: false

      - name: Assert no git credential was persisted
        # Fails if the checkout above ever goes back to leaving a token behind,
        # in this repository or in a submodule. actions/checkout stores it as an
        # http.<url>.extraheader entry, directly or through an included file.
        run: |
          set -euo pipefail
          found=0
          check() { # <label> <dir>
            if git -C "$2" config --show-origin --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
              echo "::error::git credential persisted in $1"
              git -C "$2" config --show-origin --name-only --get-regexp '^http\..*\.extraheader$' || true
              found=1
            fi
          }
          check "the repository" "$PWD"
          while IFS= read -r sub; do
            [ -n "$sub" ] && check "submodule $sub" "$PWD/$sub"
          done < <(git submodule foreach --quiet --recursive 'echo "$displaypath"' 2>/dev/null || true)
          if [ "$found" -ne 0 ]; then
            exit 1
          fi
          echo "ok: no http extraheader credential in the repository or its submodules"

      - name: Free disk space
        # The runner's default ~14GB writable disk has overflowed on this job
        # before. The build step below already builds one service per unique
        # Dockerfile; this cleanup of preinstalled toolchains reclaims ~30GB on
        # top of that so the backend + frontend builds have headroom.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby \
            /usr/share/swift /usr/local/share/boost || true
          sudo apt-get -y remove --purge azure-cli google-cloud-cli \
            microsoft-edge-stable google-chrome-stable firefox \
            'mongodb-*' 'mysql-*' 'postgresql-*' 'temurin-*-jdk' || true
          sudo apt-get -y autoremove --purge || true
          sudo apt-get -y clean || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build with Docker Compose
        if: hashFiles('docker-compose.yml') != ''
        # Build only one service per unique Dockerfile, not all services.
        # backend/celery-worker/celery-beat all use Dockerfile.backend, and
        # building them in parallel triples the disk footprint with no extra
        # coverage. We build backend (covers all three) + frontend
        # (Dockerfile.frontend.dev).
        run: |
          docker compose build --no-cache backend frontend
          echo "✓ Built backend (also covers celery-worker, celery-beat via shared Dockerfile.backend)"
          echo "✓ Built frontend"
          df -h /

      - name: Build Docker image
        if: hashFiles('docker-compose.yml') == '' && hashFiles('Dockerfile') != ''
        env:
          IMAGE: ghcr.io/${{ needs.detect.outputs.repo_lower }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          echo "✓ Built image: $IMAGE"

      - name: Boot the stack and assert it is healthy
        if: hashFiles('docker-compose.yml') != ''
        # This step is part of a required check and must be able to fail. Its
        # predecessor ran `up -d`, slept ten seconds and was continue-on-error:
        # Postgres exited on every run for want of a password and the step still
        # passed, so no pull request was ever boot-tested.
        run: |
          set -euo pipefail
          # Throwaway credentials for this job only. The stack and its volume are
          # destroyed in the tear-down step below.
          # AWS_ENDPOINT_URL is set empty: this is the shape of an install made
          # with `scripts/install.sh --no-minio`. The object store is not part of
          # this boot (it sits behind the `storage` profile), and with the
          # default endpoint the backend rightly refuses to start in production
          # mode without object-store credentials.
          (
            umask 077
            {
              echo "DB_PASSWORD=$(openssl rand -hex 24)"
              echo "API_KEY=$(openssl rand -hex 32)"
              echo "DOWNLOAD_TOKEN_SECRET=$(openssl rand -hex 32)"
              echo "AWS_ENDPOINT_URL="
            } > .env
          )
          # --wait returns once every service is running and every service with a
          # healthcheck is healthy. It fails if a container exits or the timeout
          # passes. The backend image carries its own healthcheck on /health.
          docker compose up -d --wait --wait-timeout 300
          docker compose ps
          # Backend, from the host: /health must answer and report "healthy"
          # (it reports "degraded" when Redis is unreachable).
          health="$(curl --fail --silent --show-error --max-time 10 http://localhost:8000/health)"
          echo "$health"
          echo "$health" | python3 -c 'import json, sys; sys.exit(0 if json.load(sys.stdin).get("status") == "healthy" else 1)'
          # Frontend: the smoke test operators are told to run after a deploy. It
          # fails on a dev server or on a missing security header.
          bash scripts/verify-prod-build.sh http://localhost:5173

      # Plan 8.2. A passive ZAP baseline scan of the frontend the step above
      # booted. Any alert not dispositioned in .github/zap/rules.tsv fails the
      # job (no -I: a WARN is a failure), and so does a scan that writes no
      # report.
      - name: ZAP baseline scan
        id: zap
        if: hashFiles('docker-compose.yml') != ''
        env:
          ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/zap"
          mkdir -p "$out"
          chmod 0777 "$out"  # the image runs as its own zap user
          cp .github/zap/rules.tsv "$out/rules.tsv"
          status=0
          docker run --rm --network host -v "$out:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://localhost:5173 -c rules.tsv -m 2 \
            -J zap-report.json -r zap-report.html || status=$?
          # For the release evidence: 0, 1, 2 and 3 mean different things there.
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          if [ ! -s "$out/zap-report.json" ]; then
            echo "::error::the ZAP baseline scan wrote no report (exit ${status})"
            exit 1
          fi
          # 0 no alerts, 1 a FAIL rule fired, 2 a WARN rule fired, 3 ZAP error.
          exit "$status"

      - name: Upload the ZAP report
        if: ${{ !cancelled() && hashFiles('docker-compose.yml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-baseline
          path: ${{ runner.temp }}/zap/zap-report.*
          if-no-files-found: warn
          retention-days: 14

      # The release evidence. scripts/release/scan_summary.py turns the report into
      # one small record (version, outcome, alert counts by risk, the target), and
      # release-oss.yml publishes it with any release built from this commit
      # (scripts/release/scan_evidence.py). It names no alert and no URL path.
      # Private-only: the public mirror has no scripts/release, so it skips both.
      - name: Summarise the ZAP scan for the release evidence
        if: ${{ !cancelled() && hashFiles('docker-compose.yml') != '' && github.repository == 'MarkAC007/scf-controls-platform' }}
        env:
          ZAP_STATUS: ${{ steps.zap.outputs.status }}
        run: >-
          python3 scripts/release/scan_summary.py zap
          --input "${RUNNER_TEMP}/zap/zap-report.json" --exit-code "$ZAP_STATUS"
          --out "${RUNNER_TEMP}/scan-summary/scan-zap.json"

      - name: Upload the ZAP scan summary
        if: ${{ !cancelled() && hashFiles('docker-compose.yml') != '' && github.repository == 'MarkAC007/scf-controls-platform' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-summary-zap
          path: ${{ runner.temp }}/scan-summary/scan-zap.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Show container state and logs when the boot test fails
        if: failure() && hashFiles('docker-compose.yml') != ''
        run: |
          docker compose ps --all || true
          docker compose logs --no-color --tail 200 || true

      - name: Tear down the stack
        if: always() && hashFiles('docker-compose.yml') != ''
        run: docker compose down --volumes --remove-orphans || true

  # The Python locks must follow from their .in files. This recompiles each
  # lock in a scratch copy and fails on any difference, so a changed .in file
  # cannot merge with a stale lock beside it.
  python-lock:
    name: Python Lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv from its hash-locked requirements file
        run: |
          python -m pip install --require-hashes --only-binary :all: \
            -r .github/requirements/uv.txt

      - name: Recompile the locks and fail on any difference
        run: scripts/lock-python-deps.sh --check

  # Lints every workflow in this repository with zizmor. It looks for the
  # mistakes that turn a workflow into a way in: an action not pinned by commit,
  # a token left in the checkout, a `${{ }}` value written into script text,
  # permissions wider than the job needs. Any finding fails the job.
  #
  # A finding that is accepted carries a zizmor ignore comment, with its
  # reason, on the line it excuses (docs/CONTRIBUTING.md shows the form). The
  # pinning policy is in .github/zizmor.yml.
  #
  # --offline: the lint reads the files in the checkout and nothing else. It
  # makes no network calls and is given no token, so one commit always gets one
  # answer.
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install zizmor from its hash-locked requirements file
        run: |
          python -m pip install --require-hashes --only-binary :all: \
            -r .github/requirements/zizmor.txt

      - name: Lint the workflows
        id: lint
        # --strict-collection: a workflow file zizmor cannot parse fails the
        # job. Without it the file is skipped with a warning and the lint
        # passes on what is left.
        run: zizmor --offline --no-progress --strict-collection .

      # The release evidence (see the ZAP summary in the docker job). The same
      # offline audit again with JSON output, which only counts: zizmor writes
      # one format per run. It does not decide the job; the step above does.
      - name: Summarise the lint for the release evidence
        if: ${{ !cancelled() && github.repository == 'MarkAC007/scf-controls-platform' }}
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          set -euo pipefail
          status=0
          zizmor --offline --no-progress --strict-collection --format json . > "${RUNNER_TEMP}/zizmor.json" 2> "${RUNNER_TEMP}/zizmor-json.log" || status=$?
          python3 scripts/release/scan_summary.py zizmor --input "${RUNNER_TEMP}/zizmor.json" \
            --exit-code "$status" --step-outcome "$LINT_OUTCOME" --tool-version "$(zizmor --version || true)" \
            --out "${RUNNER_TEMP}/scan-summary/scan-zizmor.json"

      - name: Upload the scan summary
        if: ${{ !cancelled() && github.repository == 'MarkAC007/scf-controls-platform' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-summary-zizmor
          path: ${{ runner.temp }}/scan-summary/scan-zizmor.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  # Known vulnerabilities in the locked dependencies (OSV-Scanner).
  #
  # scripts/osv-scan.sh scans the four lockfiles and applies the policy: a high
  # or critical finding with a fixed version published fails this job; anything
  # else is listed in the job summary. A waiver is an entry in osv-scanner.toml
  # with a reason and a date, and it fails this job once the date has passed.
  # A scanner that cannot run fails the job too: no result is not a clean result.
  #
  # The scanner sends package names and versions to api.osv.dev. It runs in a
  # digest-pinned container that is given only the lockfiles.
  #
  # No `if:` and no `needs:` here, for the same reason as the Python Lock job:
  # a skipped job counts as passing.
  osv-scan:
    name: OSV Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Scan the lockfiles and apply the blocking policy
        id: scan
        env:
          # The verdict as counts, for the release evidence (below).
          OSV_VERDICT_JSON: ${{ runner.temp }}/osv-verdict.json
        run: scripts/osv-scan.sh

      # The release evidence (see the ZAP summary in the docker job): counts by
      # rating and the lockfiles scanned, no package and no advisory.
      - name: Summarise the scan for the release evidence
        if: ${{ !cancelled() && github.repository == 'MarkAC007/scf-controls-platform' }}
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: >-
          python3 scripts/release/scan_summary.py osv
          --input "${RUNNER_TEMP}/osv-verdict.json" --step-outcome "$SCAN_OUTCOME"
          --out "${RUNNER_TEMP}/scan-summary/scan-osv.json"

      - name: Upload the scan summary
        if: ${{ !cancelled() && github.repository == 'MarkAC007/scf-controls-platform' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-summary-osv
          path: ${{ runner.temp }}/scan-summary/scan-osv.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
