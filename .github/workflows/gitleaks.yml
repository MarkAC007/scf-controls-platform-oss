# Gitleaks Secret Detection Workflow
# Detects secrets in commits and PRs before they reach main
#
# Usage: Copy to .github/workflows/gitleaks.yml in your repo

name: Gitleaks Secret Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual runs

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0  # Full history for scanning all commits
          # The token is needed for the clone only; no later step talks to the
          # remote through git.
          persist-credentials: false

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional for enterprise features

      # Optional: Upload results as artifact
      - name: Upload Results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-results
          path: results.sarif
          retention-days: 5

      # The release evidence: scripts/release/scan_summary.py counts the leaks in
      # results.sarif and names none. release-oss.yml publishes the record with any
      # release built from this commit (scripts/release/scan_evidence.py).
      # Private-only: the public mirror has no scripts/release, so it skips both.
      - name: Summarise the scan for the release evidence
        if: ${{ !cancelled() && github.repository == 'MarkAC007/scf-controls-platform' }}
        env:
          SCAN_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          set -euo pipefail
          # gitleaks writes "v8.0.0" into every SARIF it makes, so the version is
          # asked of the binary gitleaks-action installed and ran.
          version=""
          for bin in /tmp/gitleaks-*/gitleaks; do
            if [ -x "$bin" ]; then version="$("$bin" version || true)"; fi
          done
          python3 scripts/release/scan_summary.py gitleaks --input results.sarif \
            --step-outcome "$SCAN_OUTCOME" --tool-version "$version" \
            --out "${RUNNER_TEMP}/scan-summary/scan-gitleaks.json"

      - name: Upload the scan summary
        if: ${{ !cancelled() && github.repository == 'MarkAC007/scf-controls-platform' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-summary-gitleaks
          path: ${{ runner.temp }}/scan-summary/scan-gitleaks.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
