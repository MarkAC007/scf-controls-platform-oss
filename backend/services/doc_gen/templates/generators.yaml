# Document generator registry.
#
# Declarative because the licence position is per-generator, and a licence
# position that lives in scattered Python constructors is a licence position
# nobody can audit. One file, greppable, reviewable by someone who does not
# read Python.
#
# is_derivative drives the gate in services/doc_gen/licence.py:
#   false — renders SCF identifiers and names into tables. Arguably a
#           compilation. Gated only by the feature toggle.
#   true  — a language model writes prose from SCF content. Unambiguously
#           derivative. Gated additionally by derivative_generators_enabled.
#
# domain_scoped generators produce one document per SCF domain and store the
# domain in generated_documents.domain_id. Everything else stores '' there, so
# the unique index actually constrains (Postgres treats NULLs as distinct).

version: 1

generators:
  # ── Tier 1 — deterministic, data-driven ──────────────────────────────────
  - name: soa
    display_name: Statement of Applicability
    tier: 1
    document_type: soa
    is_derivative: false
    domain_scoped: false
    renderer: tier1.render_soa
    filename: statement-of-applicability.md
    description: >-
      In-scope controls with implementation status, owner, maturity level and
      justification, grouped by domain.
    requires:
      controls: true
      evidence: false
      risks: false
      systems: false

  - name: control-status
    display_name: Control Status Report
