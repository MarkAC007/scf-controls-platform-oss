# =============================================================================
# docker-compose.secrets.yml — OPT-IN file-backed credentials (#947)
#
# Everything here is additive. `docker compose up` with the base file alone is
# unchanged: a legacy `.env` install keeps working byte-for-byte.
#
# Enable it by setting, in .env (scripts/install.sh writes both lines for you):
#     SCF_SECRETS_DIR=/absolute/path/to/secrets
#     COMPOSE_FILE=docker-compose.yml:docker-compose.secrets.yml
#
# What it buys you: no credential is ever interpolated into the container's
# environment by compose on the host, so `docker inspect <service>` cannot
# print one. Each value is mounted as a 0600 file under /run/secrets and read
# by the process that needs it. That closes the biggest hole in the base file —
# DATABASE_URL is assembled on the HOST there, password included, so a
# DB_PASSWORD_FILE alone could never have reached the backend.
#
# How each service gets its value, in one line each:
#   postgres              POSTGRES_PASSWORD_FILE  (initdb only — see WARNING)
#   backend, celery-*     backend/services/secrets.py reads {NAME}_FILE itself,
#                         the two AWS_* credentials included since the S3
#                         client stopped relying on boto3's ambient chain;
#                         DATABASE_URL is blanked so db_url.py builds the DSN
#                         in-process from DB_* + DB_PASSWORD_FILE.
#                         scripts/docker/with-file-secrets.sh stays on the
#                         entrypoint as a pass-through with an empty export
#                         list — see its header.
#   minio                 the server BINARY reads MINIO_ROOT_*_FILE
#   minio-init            $(cat ...) inline, because `mc alias set` and
#                         `mc admin user add` take credentials from argv and
#                         nothing else. Reads FOUR files: the root pair to
#                         administer with, and the application pair it scopes
#                         to the evidence bucket
#   keycloak              overlay entrypoint exports from file, then kc.sh
#   keycloak-schema-init  overlay entrypoint exports PGPASSWORD from file
#   idp-init              idp/idp-init.sh loads {NAME}_FILE itself
#
# WARNING — existing installs. POSTGRES_PASSWORD_FILE is read by initdb ONLY.
# On a populated postgres_data volume the entrypoint skips initdb entirely, so a
# NEWLY GENERATED DB_PASSWORD is never applied to the `cg` role: the database
# keeps the old password while every other service starts presenting the new
# one, and the whole stack fails authentication. Adopting this overlay on an
# existing install means seeding secrets/DB_PASSWORD with the CURRENT value from
# .env (scripts/install.sh --import-env does exactly that), or running an
# explicit ALTER ROLE rotation first. See UPGRADING.md.
#
# The installer writes all ten files, unused ones EMPTY. An EMPTY file means
# "unset" everywhere. This is NOT because compose demands it: measured on
# Compose v5.4.0 a missing secret file leaves `config` at exit 0 and only warns
# at `create` (`secret file <name> does not exist`). It is because the services
# fail OPEN on an absent file -- MinIO reads MINIO_ROOT_USER_FILE itself and
# boots on the built-in minioadmin:minioadmin when it is not there. The
# entrypoint guard in docker-compose.yml refuses an empty or missing credential,
# and writing the file is what makes that refusal reliable.
# =============================================================================

secrets:
  DB_PASSWORD:
    file: "${SCF_SECRETS_DIR:-./secrets}/DB_PASSWORD"
  SCF_SECRET_KEY:
    file: "${SCF_SECRETS_DIR:-./secrets}/SCF_SECRET_KEY"
  API_KEY:
    file: "${SCF_SECRETS_DIR:-./secrets}/API_KEY"
  DOWNLOAD_TOKEN_SECRET:
    file: "${SCF_SECRETS_DIR:-./secrets}/DOWNLOAD_TOKEN_SECRET"
  MINIO_ROOT_USER:
    file: "${SCF_SECRETS_DIR:-./secrets}/MINIO_ROOT_USER"
  MINIO_ROOT_PASSWORD:
    file: "${SCF_SECRETS_DIR:-./secrets}/MINIO_ROOT_PASSWORD"
  AWS_ACCESS_KEY_ID:
    file: "${SCF_SECRETS_DIR:-./secrets}/AWS_ACCESS_KEY_ID"
  AWS_SECRET_ACCESS_KEY:
    file: "${SCF_SECRETS_DIR:-./secrets}/AWS_SECRET_ACCESS_KEY"
  KC_ADMIN_PASSWORD:
    file: "${SCF_SECRETS_DIR:-./secrets}/KC_ADMIN_PASSWORD"
  OIDC_CLIENT_SECRET:
    file: "${SCF_SECRETS_DIR:-./secrets}/OIDC_CLIENT_SECRET"

services:

  # The web bundle sends API_KEY on every request when OIDC is off, and Vite
  # bakes that value in at build time. Exposing the secrets directory to the
  # frontend build as a named context lets Dockerfile.frontend bind-mount the
  # API_KEY file for the build step only: the key stays out of .env,
  # `docker inspect` and the image layers, and rotating it invalidates the
  # cached build (a BuildKit secret mount would not). Ignored when
  # VITE_OIDC_ENABLED or VITE_GOOGLE_AUTH_ENABLED is true: those sign-in paths
  # hold a user token in the browser and must not receive the master key.
  frontend:
    build:
      additional_contexts:
        scf_secrets: "${SCF_SECRETS_DIR:-./secrets}"

  postgres:
    secrets:
      - DB_PASSWORD
    environment:
      # Blank the host-interpolated value; the image reads the file instead.
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD

  minio:
    secrets:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
    environment:
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
      # Read by the minio SERVER binary (loadEnvVarsFromFiles in
      # cmd/common-main.go), not by the image entrypoint — so it still works
      # with the base file's custom entrypoint. A MISSING file there fails
      # OPEN and boots on minioadmin, which is exactly what that entrypoint
      # guard exists to catch.
      MINIO_ROOT_USER_FILE: /run/secrets/MINIO_ROOT_USER
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/MINIO_ROOT_PASSWORD

  minio-init:
    secrets:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      # The application's own credential, which minio-init turns into a MinIO
      # user scoped to the evidence bucket (#956). Distinct from the root pair
      # since Phase 4; on an install provisioned before then the two files hold
      # the same value and the script says so and skips, rather than failing.
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    environment:
      SCF_ROOT_USER: ""
      SCF_ROOT_PASSWORD: ""
      SCF_APP_ACCESS_KEY_ID: ""
      SCF_APP_SECRET_ACCESS_KEY: ""
    # `mc alias set` and `mc admin user add` accept credentials as positional
    # argv only — there is no file flag and no stdin path. Read them inline from
    # the mounted files so they are never in the compose file or in this
    # container's declared environment. They are briefly in argv, visible via
    # /proc/<pid>/cmdline inside this short-lived container; that is the cost of
    # the mc CLI's interface.
    #
    # The provisioning logic itself is scripts/docker/minio-init.sh, shared with
    # the base file rather than copied: the base entrypoint resolves the same
    # four values from the environment and execs the same script. A second copy
    # of a credential-provisioning script drifts, and the drift is invisible
    # until an install takes the other path.
    # $$ escapes to a literal $ so the shell evaluates it at runtime.
    entrypoint:
      - /bin/sh
      - -c
      - |
        SCF_ROOT_USER="$$(cat /run/secrets/MINIO_ROOT_USER 2>/dev/null | tr -d '\n\r')"
        SCF_ROOT_PASSWORD="$$(cat /run/secrets/MINIO_ROOT_PASSWORD 2>/dev/null | tr -d '\n\r')"
        SCF_APP_ACCESS_KEY_ID="$$(cat /run/secrets/AWS_ACCESS_KEY_ID 2>/dev/null | tr -d '\n\r')"
        SCF_APP_SECRET_ACCESS_KEY="$$(cat /run/secrets/AWS_SECRET_ACCESS_KEY 2>/dev/null | tr -d '\n\r')"
        if [ -z "$$SCF_ROOT_USER" ] || [ -z "$$SCF_ROOT_PASSWORD" ]; then
          echo "FATAL: minio-init refuses to start: /run/secrets/MINIO_ROOT_USER or MINIO_ROOT_PASSWORD is missing or empty." >&2
          echo "       Run scripts/install.sh to provision \$$SCF_SECRETS_DIR." >&2
          exit 1
        fi
        export SCF_ROOT_USER SCF_ROOT_PASSWORD SCF_APP_ACCESS_KEY_ID SCF_APP_SECRET_ACCESS_KEY
        exec /bin/sh /scf/minio-init.sh

  backend:
    secrets:
      - DB_PASSWORD
      - SCF_SECRET_KEY
      - API_KEY
      - DOWNLOAD_TOKEN_SECRET
      - OIDC_CLIENT_SECRET
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    volumes:
      - ./scripts/docker/with-file-secrets.sh:/with-file-secrets.sh:ro
    # boto3 reads AWS_* from the environment and nowhere else, so the wrapper
    # exports those two from their files and then execs the real command.
    # Overriding `entrypoint` clears the image's CMD, so the original uvicorn
    # command is restated here verbatim (Dockerfile.backend, final CMD).
    entrypoint: ["/bin/sh", "/with-file-secrets.sh"]
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    environment:
      # Blank the pre-composed DSN so db_url.get_database_url() builds it
      # in-process from DB_HOST/DB_PORT/DB_NAME/DB_USER + DB_PASSWORD_FILE.
      # Leaving it set would defeat the whole overlay: compose interpolates
      # ${DB_PASSWORD:-} on the host, so the plaintext password would sit in
      # `docker inspect` output no matter what the file tier says.
      DATABASE_URL: ""
      DB_PASSWORD_FILE: /run/secrets/DB_PASSWORD
      SCF_SECRET_KEY: ""
      SCF_SECRET_KEY_FILE: /run/secrets/SCF_SECRET_KEY
      API_KEY: ""
      API_KEY_FILE: /run/secrets/API_KEY
      DOWNLOAD_TOKEN_SECRET: ""
      DOWNLOAD_TOKEN_SECRET_FILE: /run/secrets/DOWNLOAD_TOKEN_SECRET
      OIDC_CLIENT_SECRET: ""
      OIDC_CLIENT_SECRET_FILE: /run/secrets/OIDC_CLIENT_SECRET
      AWS_ACCESS_KEY_ID: ""
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/AWS_SECRET_ACCESS_KEY

  celery-worker:
    secrets:
      - DB_PASSWORD
      - SCF_SECRET_KEY
      - API_KEY
      - DOWNLOAD_TOKEN_SECRET
      - OIDC_CLIENT_SECRET
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    volumes:
      - ./scripts/docker/with-file-secrets.sh:/with-file-secrets.sh:ro
    # The base file already declares `command:` for this service, and compose
    # keeps it when only `entrypoint` is overridden here.
    entrypoint: ["/bin/sh", "/with-file-secrets.sh"]
    environment:
      DATABASE_URL: ""
      DB_PASSWORD_FILE: /run/secrets/DB_PASSWORD
      SCF_SECRET_KEY: ""
      SCF_SECRET_KEY_FILE: /run/secrets/SCF_SECRET_KEY
      API_KEY: ""
      API_KEY_FILE: /run/secrets/API_KEY
      DOWNLOAD_TOKEN_SECRET: ""
      DOWNLOAD_TOKEN_SECRET_FILE: /run/secrets/DOWNLOAD_TOKEN_SECRET
      OIDC_CLIENT_SECRET: ""
      OIDC_CLIENT_SECRET_FILE: /run/secrets/OIDC_CLIENT_SECRET
      AWS_ACCESS_KEY_ID: ""
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/AWS_SECRET_ACCESS_KEY

  celery-beat:
    secrets:
      - DB_PASSWORD
      - SCF_SECRET_KEY
      - API_KEY
      - DOWNLOAD_TOKEN_SECRET
      - OIDC_CLIENT_SECRET
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    volumes:
      - ./scripts/docker/with-file-secrets.sh:/with-file-secrets.sh:ro
    entrypoint: ["/bin/sh", "/with-file-secrets.sh"]
    environment:
      DATABASE_URL: ""
      DB_PASSWORD_FILE: /run/secrets/DB_PASSWORD
      SCF_SECRET_KEY: ""
      SCF_SECRET_KEY_FILE: /run/secrets/SCF_SECRET_KEY
      API_KEY: ""
      API_KEY_FILE: /run/secrets/API_KEY
      DOWNLOAD_TOKEN_SECRET: ""
      DOWNLOAD_TOKEN_SECRET_FILE: /run/secrets/DOWNLOAD_TOKEN_SECRET
      OIDC_CLIENT_SECRET: ""
      OIDC_CLIENT_SECRET_FILE: /run/secrets/OIDC_CLIENT_SECRET
      AWS_ACCESS_KEY_ID: ""
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/AWS_SECRET_ACCESS_KEY

  keycloak-schema-init:
    secrets:
      - DB_PASSWORD
    environment:
      # PGPASSWORD has no libpq _FILE variant, so the entrypoint reads the file.
      PGPASSWORD: ""
      PGPASSWORD_FILE: /run/secrets/DB_PASSWORD
    entrypoint:
      - /bin/sh
      - -c
      - |
        PGPASSWORD="$$(cat "$${PGPASSWORD_FILE:-/run/secrets/DB_PASSWORD}" 2>/dev/null | tr -d '\n\r')"
        if [ -z "$$PGPASSWORD" ]; then
          echo "FATAL: keycloak-schema-init: $${PGPASSWORD_FILE:-/run/secrets/DB_PASSWORD} is missing or empty." >&2
          exit 1
        fi
        export PGPASSWORD
        psql -h postgres -U cg -d cg_scf -c 'CREATE SCHEMA IF NOT EXISTS keycloak'
        echo 'keycloak schema ready'

  keycloak:
    secrets:
      - DB_PASSWORD
      - KC_ADMIN_PASSWORD
    # The KC image runs as uid 1000. On Linux, scripts/install.sh chgrps the
    # secrets dir to gid 1001 and chmods 0640, so this container needs that
    # group to read its files. Harmless on macOS Docker Desktop.
    group_add: ["1001"]
    environment:
      KC_DB_PASSWORD: ""
      KC_DB_PASSWORD_FILE: /run/secrets/DB_PASSWORD
      KC_BOOTSTRAP_ADMIN_PASSWORD: ""
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/KC_ADMIN_PASSWORD
    # Same shape as the base entrypoint (the ${VAR:?} guards are preserved), with
    # the two passwords loaded from their files first. Keycloak 26 does support
    # KC_DB_PASSWORD_FILE natively, but the bootstrap admin password does not
    # have a file form, so one entrypoint handles both and stays symmetric.
    entrypoint:
      - /bin/bash
      - -c
      - |
        _load() {
          local _f="$$2"
          [[ -n "$$_f" ]] || return 0
          if [[ ! -r "$$_f" ]]; then
            echo "FATAL: keycloak: $$1 file $$_f is missing or unreadable." >&2
            exit 1
          fi
          local _v
          _v="$$(tr -d '\n\r' < "$$_f")"
          [[ -n "$$_v" ]] || return 0
          printf -v "$$1" '%s' "$$_v"
          export "$${1?}"
        }
        _load KC_DB_PASSWORD "$${KC_DB_PASSWORD_FILE:-}"
        _load KC_BOOTSTRAP_ADMIN_PASSWORD "$${KC_BOOTSTRAP_ADMIN_PASSWORD_FILE:-}"
        : "$${KC_BOOTSTRAP_ADMIN_USERNAME:?KC_ADMIN_USER is required when using --profile idp}"
        : "$${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD is required when using --profile idp}"
        : "$${KC_DB_PASSWORD:?DB_PASSWORD is required when using --profile idp}"
        exec /opt/keycloak/bin/kc.sh start --import-realm

  idp-init:
    secrets:
      - KC_ADMIN_PASSWORD
      - OIDC_CLIENT_SECRET
    group_add: ["1001"]
    environment:
      # idp/idp-init.sh loads these two from their _FILE variants itself.
      KC_ADMIN_PASSWORD: ""
      KC_ADMIN_PASSWORD_FILE: /run/secrets/KC_ADMIN_PASSWORD
      OIDC_CLIENT_SECRET: ""
      OIDC_CLIENT_SECRET_FILE: /run/secrets/OIDC_CLIENT_SECRET
