apiVersion: v1
kind: Service
metadata:
  name: {{ include "scf.backendServiceName" . }}
  labels:
    {{- include "scf.componentLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  {{- with .Values.backend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "scf.componentSelectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
