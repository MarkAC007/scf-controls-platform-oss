{{- if and .Values.catalogData.enabled .Values.catalogData.importer.enabled }}
{{/*

Extract an SCF workbook into the catalogue JSON the backend seeds from. The
workbook must already be on the claim at catalogData.importer.workbookPath.
copy it there with `kubectl cp` into any pod that mounts the claim.

*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "scf.fullname" . }}-catalog-importer
  labels:
    {{- include "scf.componentLabels" (dict "ctx" . "component" "catalog-importer") | nindent 4 }}
  annotations:
    # post-* by default: the workbook is copied onto the volume after the
    # release exists, so the import cannot run before that. Set
    # catalogData.importer.hook to a pre-* phase when the volume is pre-staged
    # (existingClaim), which lets the backend find the catalogue on first start.
    "helm.sh/hook": {{ .Values.catalogData.importer.hook | quote }}
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.catalogData.importer.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "scf.componentSelectorLabels" (dict "ctx" . "component" "catalog-importer") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "scf.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "scf.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: catalog-importer
          image: {{ include "scf.image" (dict "image" .Values.catalogData.importer.image "root" $) }}
          imagePullPolicy: {{ .Values.catalogData.importer.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # The volume is mounted at /out, not over /app/data/json. The image
          # ships three curated catalogue files in that directory which the
          # spreadsheet does not produce; mounting over it would hide them from
          # the copy below and leave the volume short of a file the backend
          # needs at startup.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cp -n /app/data/json/*.json /out/ 2>/dev/null || true
              python /app/scripts/extract_scf_data.py \
                "/out/{{ .Values.catalogData.importer.workbookFile }}" \
                --output-dir /out
              ls -1 /out/*.json
          resources:
            {{- toYaml .Values.catalogData.importer.resources | nindent 12 }}
          volumeMounts:
            - name: catalog-data
              mountPath: /out
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: catalog-data
          persistentVolumeClaim:
            claimName: {{ .Values.catalogData.existingClaim | default (printf "%s-catalog-data" (include "scf.fullname" .)) }}
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
{{- end }}
