{{- if and .Values.serviceAccount.create (or .Values.migrations.enabled (include "scf.importerRunsPreInstall" .)) }}
{{/*
Created ahead of the pre-install/pre-upgrade Jobs, which run before the
workload service account exists. Weight must stay below theirs.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "scf.hookServiceAccountName" . }}
  labels:
    {{- include "scf.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
