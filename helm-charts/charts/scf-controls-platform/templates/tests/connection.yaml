apiVersion: v1
kind: Pod
metadata:
  name: {{ include "scf.fullname" . }}-test-connection
  labels:
    {{- include "scf.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: {{ include "scf.image" (dict "image" .Values.tests.image "root" $) }}
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          curl -fsS "{{ include "scf.backendUrl" . }}/health" | grep -q '"service"'
          curl -fsS "http://{{ include "scf.frontendServiceName" . }}:{{ .Values.frontend.service.port }}/health" >/dev/null
          echo "backend and frontend both responding"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
