# SCF login theme — a thin child of Keycloak 26's stock keycloak.v2 login theme.
#
# It exists for one reason: raise the login form's touch targets to the 44x44
# CSS-px minimum (see resources/css/scf.css). Everything else is inherited.
#
# `styles` is REPLACED by a child theme, not merged, so the parent's
# css/styles.css is restated here alongside ours. Keycloak resolves each entry
# by walking the parent chain, so css/styles.css still loads from keycloak.v2
# even though it does not exist in this directory. Ours is listed last so it
# wins on equal specificity.
#
# `stylesCommon` (the PatternFly v5 stylesheets) is deliberately left unset so
# it inherits from keycloak.v2 intact — overriding `styles` does not disturb it.
parent=keycloak.v2
styles=css/styles.css css/scf.css
