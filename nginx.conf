# Nginx configuration for CG CCF Frontend
# Optimized for Docker deployment

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml image/svg+xml
               text/x-component text/x-cross-domain-policy;

    # ------------------------------------------------------------------------
    # Cache-Control, also by URI rather than per-location.
    #
    # This is the mechanism that lets EVERY add_header live at http level and
    # NO location declare one. That matters: a location that declares any
    # add_header of its own silently discards every inherited add_header, so
    # the old shape — where locations set Cache-Control — was one forgotten
    # line away from serving a page with no security headers at all. It had in
    # fact already happened: /health, /data/ and the static-asset location were
    # serving no CSP, no HSTS and no Referrer-Policy.
    #
    # Values mirror the `expires` directives they replace (1y / 1h). The
    # `Expires` header is gone; Cache-Control max-age supersedes it everywhere.
    #
    # Regex arms are evaluated in the order written, first match wins:
    #   /assets/**           Vite's content-hashed output — safe to freeze for a year.
    #   root-level .js/.css  sw.js, workbox-*.js, theme-init.js — UNHASHED names,
    #                        so they must revalidate or an edit would never reach
    #                        a returning browser.
    #   other static assets  images and fonts, frozen as before.
    #   /data/**             catalogue JSON, 1h, as before. It sits after the
    #                        extension arm to preserve nginx's original
    #                        regex-location-beats-prefix-location precedence.
    #
    # The empty value for /api/ is deliberate: nginx skips add_header entirely
    # when the value resolves to empty, leaving the backend's own caching
    # headers untouched.
    # ------------------------------------------------------------------------
    map $uri $cache_control {
        default                     "no-cache, no-store, must-revalidate";
        ~^/api/                     "";
        ~^/assets/                  "public, max-age=31536000, immutable";
        ~*^/[^/]+\.(js|css)$        "no-cache, must-revalidate";
        ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$  "public, max-age=31536000, immutable";
        ~^/data/                    "public, max-age=3600, must-revalidate";
    }

    # Security headers.
    #
    # Declared ONCE, here, and inherited by every location — see the note above
    # for why no location may declare an add_header of its own.
    add_header Cache-Control $cache_control always;

    # Content-Security-Policy. Declared here and nowhere else — it used to be
    # copy-pasted into all five location blocks, which is how issue #403 (an
    # invalid `https://*.s3.*.amazonaws.com` source expression) survived in nine
    # places across three config files.
    #
    # script-src has NO 'unsafe-inline': the only inline script the app had
    # (theme bootstrap) now lives in webclient/public/theme-init.js and is
    # covered by 'self' (#502, #133). Keep it that way — an inline <script>
    # anywhere in index.html silently breaks the app under this policy.
    #
    # style-src DOES still need 'unsafe-inline' (React inline style props +
    # component libraries). Removing it is tracked separately in #502.
    #
    # ${EXTRA_CONNECT_SRC} is substituted at container start by
    # docker-entrypoint.sh. It exists so a self-hosted deployment can allow its
    # own object-storage origin (bundled MinIO, a non-eu-west-1 S3 region, a
    # custom S3 endpoint) without editing this tracked file. Empty by default.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://accounts.google.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://apis.google.com https://accounts.google.com https://*.s3.amazonaws.com https://*.s3.eu-west-1.amazonaws.com https://*.blob.core.windows.net ${EXTRA_CONNECT_SRC}; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'self' https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    add_header X-Content-Type-Options "nosniff" always;
    # X-XSS-Protection header removed (deprecated, replaced by CSP)
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # frame-ancestors in the CSP above is the authoritative clickjacking control.
    # X-Frame-Options is the legacy equivalent for pre-CSP2 browsers, kept in
    # step with webclient/nginx-ec2.conf (the config that ran in production with
    # Google Sign-In working). It governs who may frame US — it does not affect
    # Google's own sign-in iframe/popup rendering inside our page.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Google Sign-In uses a popup that must retain window.opener, so this is
    # same-origin-allow-popups rather than the stricter same-origin.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Issue #291 — the app uses none of these APIs, so deny them outright.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # HSTS: Instructs browsers to always use HTTPS for this domain.
    # Even though TLS terminates at the ALB/Cloudflare layer, the HSTS header
    # is passed through to the browser and prevents SSL stripping attacks.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Health check endpoint
        location /health {
            access_log off;
            # default_type rather than a header directive: any such directive
            # declared here would discard every inherited security header.
            default_type text/plain;
            return 200 "OK\n";
        }

        # API proxy - proxy all /api/* requests to backend
        # BACKEND_URL is substituted at runtime via envsubst (becomes literal URL)
        # IMPORTANT: Backend routes are at /api/* so we keep the /api prefix
        location /api/ {
            # Proxy to backend /api/ path
            # After envsubst: proxy_pass https://backend.run.app/api/;
            proxy_pass $BACKEND_URL/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # CORS is handled by FastAPI backend with strict origin allowlist
            # Do NOT handle preflight here - it bypasses backend CORS validation
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            # Cache-Control comes from the $cache_control map. Nothing is
            # declared here, so the inherited security headers survive.
        }

        # Cache JSON data files (CCF data)
        location /data/ {
            # Cache-Control comes from the $cache_control map. Nothing is
            # declared here, so the inherited security headers survive.
        }

        # Single Page Application routing
        # All routes should serve index.html
        location / {
            try_files $uri $uri/ /index.html;
            # Cache-Control comes from the $cache_control map. Nothing is
            # declared here, so the inherited security headers survive.
        }

        # Security: Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
