# =============================================================================
# nginx Configuration for EC2 Deployment
# =============================================================================
# This configuration includes proxy_pass for /api/* routes to the backend
# container. Used when frontend and backend run as Docker Compose services.
#
# Loaded as /etc/nginx/conf.d/default.conf, i.e. inside nginx's http context —
# which is why the map below is legal here.
# =============================================================================

# Cache-Control by URI rather than per-location.
#
# This is the mechanism that lets EVERY add_header live in the server block and
# NO location declare one. That matters: a location declaring any add_header of
# its own silently discards every inherited add_header — which had already
# happened here, leaving /health, /data/ and the static-asset location with no
# CSP, no Referrer-Policy and no HSTS.
#
# Values mirror the `expires` directives they replace (1y / 1h). Regex arms are
# evaluated in the order written, first match wins:
#   /assets/**           Vite's content-hashed output — safe to freeze for a year.
#   root-level .js/.css  sw.js, workbox-*.js, theme-init.js — UNHASHED names, so
#                        they must revalidate or an edit would never reach a
#                        returning browser.
#   other static assets  images and fonts, frozen as before.
#   /data/**             catalogue JSON, 1h, as before. It sits after the
#                        extension arm to preserve nginx's original
#                        regex-location-beats-prefix-location precedence.
#
# The empty value for /api/ is deliberate: nginx skips add_header entirely when
# the value resolves to empty, leaving the backend's own caching headers alone.
map $uri $cache_control {
    default                     "no-cache, no-store, must-revalidate";
    ~^/api/                     "";
    ~^/assets/                  "public, max-age=31536000, immutable";
    ~*^/[^/]+\.(js|css)$        "no-cache, must-revalidate";
    ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$  "public, max-age=31536000, immutable";
    ~^/data/                    "public, max-age=3600, must-revalidate";
}

# Original client protocol, for X-Forwarded-Proto to the backend.
#
# TLS terminates at the ALB/Cloudflare, so this nginx listens on plain HTTP and
# $scheme is always "http". Forwarding $scheme would make FastAPI/uvicorn emit
# http:// redirect Location headers on the trailing-slash 307s (issue #856).
# Honour the proto the edge already set in X-Forwarded-Proto, falling back to
# $scheme for direct/local HTTP access (dev, container health probes).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — declared ONCE here and inherited by every location.
    # Do not add an add_header to any location below; see the note above.
    add_header Cache-Control $cache_control always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # Required for Google OAuth popup flow to communicate back to parent window
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # Issue #291 — the app uses none of these APIs, so deny them outright.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content-Security-Policy. Declared here and nowhere else — it used to be
    # copy-pasted into every location, which is how the invalid
    # `https://*.s3.*.amazonaws.com` source expression (#403) survived in nine
    # places across three config files.
    #
    # script-src has NO 'unsafe-inline': the theme bootstrap that needed it now
    # lives in webclient/public/theme-init.js (#502, #133). style-src still
    # needs it for React inline style props.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://accounts.google.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https://apis.google.com https://accounts.google.com https://*.s3.amazonaws.com https://*.s3.eu-west-1.amazonaws.com https://*.blob.core.windows.net; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'self' https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml image/svg+xml;

    # Health check endpoint for nginx itself
    location /health {
        access_log off;
        # default_type rather than a header directive: any such directive
        # declared here would discard every inherited security header.
        default_type text/plain;
        return 200 "OK\n";
    }

    # Backend health check - ALB uses /api/health but backend exposes /health
    # This specific route proxies to the backend's actual health endpoint
    location = /api/health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # API proxy - forward all /api/* requests to backend container
    # Backend runs on port 8000 in Docker Compose network
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # CORS is handled by FastAPI backend with strict origin allowlist
        # Do NOT handle preflight here - it bypasses backend CORS validation
    }

    # Cache static assets aggressively (Cache-Control from the $cache_control map)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    }

    # Cache JSON data files (Cache-Control from the $cache_control map)
    location /data/ {
    }

    # SPA routing - all other routes serve index.html
    # This allows React Router to handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
